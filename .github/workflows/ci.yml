name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillstrader-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vite 7 requires ^20.19.0 || >=22.12.0 (skillstrader-frontend/node_modules/vite/package.json engines)
          node-version: "22"
          cache: npm
          cache-dependency-path: skillstrader-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint (advisory)
        # Informational: 14 errors pre-date this workflow rewrite and live in modules
        # unrelated to it. Remove continue-on-error once they are cleared, which also
        # retires the react-hooks/set-state-in-effect finding. See S4.
        continue-on-error: true
        run: npm run lint

      - name: Dependency audit (advisory)
        # Informational: Adrielle applies dependency and CVE patches by hand, so this
        # reports findings without blocking merges. Remove continue-on-error once the
        # known highs are patched. See docs/system-improvements.md S7.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
