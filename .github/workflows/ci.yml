name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  repo-guards:
    # Runs at the repository root, where the runtime-data containment check can see the
    # whole tracked tree. Fast and blocking: this is the control that prevents a repeat of
    # docs/system-improvements.md S1 (applicant uploads and the database were committed).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan revisions, not just the tip.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert no PocketBase runtime data is tracked
        run: node scripts/check-pb-data-tracked.mjs

      - name: Secret scan (advisory)
        # Advisory until a GITLEAKS_LICENSE repository secret is configured; the action
        # refuses to start without it. Remove continue-on-error once the secret exists,
        # which makes this blocking. See docs/system-improvements.md S2.
        continue-on-error: true
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        uses: gitleaks/gitleaks-action@v2

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillstrader-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vite 7 requires ^20.19.0 || >=22.12.0 (skillstrader-frontend/node_modules/vite/package.json engines)
          node-version: "22"
          cache: npm
          cache-dependency-path: skillstrader-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint (advisory)
        # Informational: 1 error remains after the 2026-10-24 pass cleared 13 of the original 14
        # (unused bindings, one `any`, and the swallowed `error` variables that were hiding S10).
        # The survivor is AuditLog.tsx's react-hooks/set-state-in-effect, a render-timing change held
        # for review. Delete continue-on-error once that is fixed to make lint a gate. See S4.
        continue-on-error: true
        run: npm run lint

      - name: Dependency audit (advisory)
        # Informational: Adrielle applies dependency and CVE patches by hand, so this
        # reports findings without blocking merges. Remove continue-on-error once the
        # known highs are patched. See docs/system-improvements.md S7.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
